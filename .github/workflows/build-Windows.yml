name: Build Windows amd64 installer

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_NOLOGO: 'true'

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: windows-nuget-${{ hashFiles('**/*.csproj') }}
      - name: Validate localization and behavior
        shell: pwsh
        run: |
          python scripts/check-localization.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet run --project tests/Localization.Tests -c Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Publish self-contained Windows amd64 application
        shell: pwsh
        run: |
          $version = dotnet msbuild OpenBurningSuite/OpenBurningSuite.csproj -getProperty:Version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Release tag must match project version v$version"
          }
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          dotnet publish OpenBurningSuite/OpenBurningSuite.csproj -c Release -r win-x64 --self-contained true -p:PublishReadyToRun=true -o publish
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Install verified official Inno Setup 7.1.1
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.1-x64.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe' -OutFile $setup
          if ((Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant() -ne '8a5a6711c3766a6e5fb74f280ba0e3551e719ce94538d901fdbd1f8f9920b3f0') {
            throw 'Inno Setup checksum mismatch'
          }
          $compiler = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          $installation = Start-Process $setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$compiler") -Wait -PassThru
          if ($installation.ExitCode -ne 0) { throw 'Inno Setup installation failed' }
          "INNO_DIR=$compiler" >> $env:GITHUB_ENV
      - name: Build multilingual installer
        shell: pwsh
        run: |
          & "$env:INNO_DIR\ISCC.exe" "/DAppVersion=$env:APP_VERSION" build/installer.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify installation language and application startup
        shell: pwsh
        run: |
          $installer = (Get-Item installer/*.exe).FullName
          foreach ($language in @('en', 'ru', 'zh-Hans', 'ja')) {
            $installerLanguage = if ($language -eq 'zh-Hans') { 'zh' } else { $language }
            $target = Join-Path $env:RUNNER_TEMP "OBS-$language"
            $setup = Start-Process $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LANG=$installerLanguage", "/DIR=$target") -Wait -PassThru
            if ($setup.ExitCode -ne 0) { throw "Installation failed: $language, exit $($setup.ExitCode)" }
            $selected = (Get-ItemProperty 'HKLM:\Software\OpenBurningSuite').UILanguage
            if ($selected -ne $installerLanguage) { throw "Installer language was not persisted: $language" }
            $app = Start-Process "$target\OpenBurningSuite.exe" -PassThru
            Start-Sleep -Seconds 12
            $app.Refresh()
            if ($app.HasExited) { throw "Application exited during $language startup: $($app.ExitCode)" }
            $titles = @{
              'en' = 'Open Burning Suite — Disc Burning & Imaging'
              'ru' = 'Open Burning Suite — Запись дисков и создание образов'
              'zh-Hans' = 'Open Burning Suite — 光盘刻录与镜像制作'
              'ja' = 'Open Burning Suite — ディスクの書き込み・イメージ作成'
            }
            if ($app.MainWindowHandle -eq [IntPtr]::Zero -or $app.MainWindowTitle -ne $titles[$language]) {
              throw "Expected localized application window for $language; got '$($app.MainWindowTitle)'"
            }
            Stop-Process -Id $app.Id
            $uninstall = Start-Process "$target\unins000.exe" -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
            if ($uninstall.ExitCode -ne 0) { throw "Uninstallation failed: $language" }
          }
      - uses: actions/upload-artifact@v5
        with:
          name: windows-amd64-installer
          path: installer/*.exe
          if-no-files-found: error
      - name: Publish one installer to Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Open Burning Suite v${{ env.APP_VERSION }} · Windows amd64 · English / Русский / 简体中文 / 日本語
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: installer/*.exe
